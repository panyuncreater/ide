<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="mlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0078D4"/>
      <stop offset="50%" stop-color="#0A85D2"/>
      <stop offset="100%" stop-color="#50E6FF"/>
    </linearGradient>
  </defs>

  <!-- M: continuous stroke, no overlapping segments -->
  <path d="M 28 42 L 28 86 L 42 56 L 56 86 L 56 42"
        stroke="url(#mlGrad)"
        stroke-width="7"
        fill="none"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-opacity="0.95"/>

  <!-- L: separate stroke, 12px gap from M -->
  <path d="M 68 60 L 68 86 L 96 86"
        stroke="url(#mlGrad)"
        stroke-width="7"
        fill="none"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-opacity="0.95"/>

  <!-- Central decorative diamond (double-layer) -->
  <polygon points="62,50 70,58 62,66 54,58" fill="#0078D4" opacity="0.25"/>
  <polygon points="62,52 68,58 62,64 56,58" fill="#50E6FF" opacity="0.55"/>
</svg>
