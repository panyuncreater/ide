# ============================================================
# MiniLang CI/CD 流水线（跨平台）
# ------------------------------------------------------------
# 触发条件：push / pull_request 到 main / master 分支
# 作业：
#   build-test         — 跨平台构建并运行全部测试
#                        (Windows MSVC / Ubuntu GCC / macOS Clang)
#   coverage           — Windows 代码覆盖率（OpenCppCoverage + 阈值检查）
#   coverage-linux     — Linux 代码覆盖率（gcovr + codecov + 阈值检查）
#   test-harness       — Windows test_harness 审计工具
#   static-analysis    — cppcheck 静态代码分析
#   clang-tidy         — clang-tidy 静态分析（continue-on-error，信息性）
#   sanitize-asan      — ASan+UBSan 内存错误门禁（Linux，阻断式）
#   perf-benchmark     — 性能基准回归（与 perf-baseline.json 对比）
#   docs               — Doxygen 文档构建并部署到 GitHub Pages
#
# 修复问题 9（ctest 并行）/ 问题 7（覆盖率）/ 问题 17（ccache）
# Phase 3: 1.1 跨平台 CI / 2.3 codecov 集成
# R116: CI 基础设施套件（perf-benchmark / 阈值 / clang-tidy / docs）
# ============================================================

name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 4 * * 0'   # 每周日自动运行覆盖率
  workflow_dispatch:
    inputs:
      qt_version:
        description: 'Qt version (override default, e.g. 6.8.3, 6.9.3)'
        required: false
        default: ''

env:
  CMAKE_BUILD_TYPE: Release
  # Qt 6.8.3 LTS（稳定且兼容）。
  # 注：Qt 6.7+ 在 Linux 上将架构名从 gcc_64 改为 linux_gcc_64，
  #     aqtinstall ≤3.2.1 仍使用旧名导致 "qt_base not found"（issue #908）。
  #     该 bug 在 aqtinstall 3.3.0 的 PR #909 中修复，故使用 3.3.0。
  #     但为稳妥起见，Linux 矩阵仍显式使用 linux_gcc_64 架构名。
  #     qttools 模块在 Qt 6.8.3 的 aqtinstall 元数据中不可用（所有平台均报
  #     "packages ['qttools'] were not found"），故不安装。
  # L30 修复：Ubuntu 通过 apt 安装 qt6-l10n-tools（提供 lrelease6），
  # CMakeLists.txt lrelease 回退路径（find_program）编译 .ts → .qm。
  # macOS/Windows 本地有 LinguistTools，无需额外安装。
  # 可通过 Actions → Run workflow → qt_version 手动覆盖 Qt 版本。
  QT_VERSION: ${{ inputs.qt_version != '' && inputs.qt_version || '6.8.3' }}
  AQT_VERSION: '==3.3.0'
  # 消除 macOS Homebrew 的 aws/tap 不受信任警告（ccache-action 内部 brew install 触发）
  HOMEBREW_NO_REQUIRE_TAP_TRUST: 1

jobs:
  # ============================================================
  # 作业 1：跨平台构建 + 单元测试
  # Phase 3 Task 1.1: 策略矩阵覆盖 Windows / Ubuntu / macOS
  # ============================================================
  build-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: win64_msvc2022_64
            generator: Ninja
            c_compiler: cl
            cpp_compiler: cl
          - os: ubuntu-latest
            arch: linux_gcc_64   # Qt 6.7+ 在 Linux 上将 gcc_64 改名为 linux_gcc_64
            generator: Ninja
            c_compiler: gcc
            cpp_compiler: g++
          - os: macos-latest
            arch: clang_64
            generator: Ninja
            c_compiler: clang
            cpp_compiler: clang++

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # 应用 QFluentKit 本地补丁（submodule 修改无法直接推送至上游第三方仓库，
      # 故以 patch 文件方式在 CI 中应用）。补丁内容：macOS arm64 继承构造函数
      # `using Base::Base` 不生成符号导致链接失败，改用显式构造函数；同时将
      # InlineSpinBoxBase 方法内联化以匹配显式构造；注释掉 QFluentExample 子目录；
      # 安装条件增加顶层源码目录判断（避免被 add_subdirectory 时误安装到 Qt 目录）。
      # 必须在 CMake 配置之前应用，否则 SpinBox.h 的 `using Base::Base` 会导致
      # macOS arm64 链接失败（Undefined symbols for architecture arm64）。
      - name: 应用 QFluentKit 本地补丁
        shell: bash
        run: git apply --directory=third_party/QFluentKit --whitespace=nowarn patches/qfluentkit-local-fixes.patch

      # 修复问题 17：ccache + GHA cache 加速构建
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ${{ matrix.os }}-${{ env.CMAKE_BUILD_TYPE }}-${{ matrix.arch }}

      # ---- Windows: 安装 Qt6（MSVC 工具链）----
      - name: 安装 Qt6 (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: ${{ matrix.arch }}
          aqtversion: ${{ env.AQT_VERSION }}
          cache: true

      # ---- Ubuntu / macOS: 安装 Qt6 ----
      - name: 安装 Qt6 (Unix)
        if: runner.os != 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: ${{ runner.os == 'Linux' && 'linux' || 'mac' }}
          target: desktop
          arch: ${{ matrix.arch }}
          aqtversion: ${{ env.AQT_VERSION }}
          cache: true

      # ---- Windows 专属: MSVC 开发环境 ----
      - name: 设置 MSVC 开发环境
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      # ---- Windows: 使用 CMake Preset ----
      - name: 设置 QTDIR (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "QTDIR=${{ env.QT_ROOT_DIR }}/.." >> $GITHUB_ENV

      - name: 配置 CMake (Windows Preset)
        if: runner.os == 'Windows'
        run: cmake --preset windows-msvc-release -DMINILANG_USE_CCACHE=ON

      # ---- Linux: 使用 CMake Preset（与本地构建一致，修复审计问题 1）----
      - name: 设置 QTDIR (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: echo "QTDIR=${{ env.QT_ROOT_DIR }}/.." >> $GITHUB_ENV

      # L30: 安装 Qt Linguist lrelease 工具（Ubuntu）。
      # aqtinstall 的 qttools 模块在 Qt 6.8.3 元数据中不可用（"packages ['qttools']
      # were not found"），但 Ubuntu apt 包 qt6-l10n-tools 提供 lrelease6/lrelease 可执行文件。
      # CMakeLists.txt 的 lrelease 回退路径（find_program）会找到它并编译 .ts → .qm，
      # 替代原先的优雅降级（跳过 .qm 编译）。macOS/Windows 本地有 LinguistTools 无需此步。
      - name: 安装 Qt Linguist 工具 (lrelease, Linux)
        if: runner.os == 'Linux'
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y qt6-l10n-tools qt6-tools-dev
          # 创建 lrelease 兼容符号链接（apt 提供的是 lrelease6，CMake find_program
          # 会依次尝试 lrelease / lrelease6 / lrelease-qt6，此步骤仅为冗余保障）
          which lrelease6 && sudo ln -sf "$(which lrelease6)" /usr/local/bin/lrelease || true
          # 验证至少一种 lrelease 变体可用（不强制 lrelease6，CMake find_program 会兜底）
          which lrelease6 || which lrelease || which lrelease-qt6
          # 注：Qt 工具链仅接受单横线 -version，--version 会被视为未知选项
          # → 打印用法并退出码 1，导致此步骤（set -e）误报失败
          lrelease6 -version 2>/dev/null || lrelease -version

      - name: 配置 CMake (Linux Preset)
        if: runner.os == 'Linux'
        run: cmake --preset linux-gcc-release -DMINILANG_USE_CCACHE=ON

      # ---- macOS: 使用 CMake Preset（与本地构建一致，修复审计问题 1）----
      - name: 设置 QTDIR (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: echo "QTDIR=${{ env.QT_ROOT_DIR }}/.." >> $GITHUB_ENV

      # macOS 26 (Tahoe) / Xcode 26 移除了 AGL 框架（OpenGL 旧 Carbon 接口），
      # 但 Qt 6.8.x 的 Qt framework 二进制文件（如 QtGui.framework/QtGui）的
      # LC_LOAD_DYLIB 仍链接了 AGL。链接器传递依赖时会尝试加载 AGL，找不到
      # 即报 "ld: framework 'AGL' not found"。
      # 修复：创建空的 AGL stub framework。链接器能找到 AGL（虽然为空），
      # 运行时不需要 AGL（Qt 6.8 不再调用 AGL API）。
      # 注：sed 修补 .cmake/.prl 文件无效，因为引用来自二进制文件的链接依赖。
      # 关键：必须用 -install_name 设置最终路径（/Library/Frameworks/...），
      # 否则 dylib 默认 install_name 是创建时的临时路径（/tmp/...），链接器
      # 会把临时路径写入可执行文件的 LC_LOAD_DYLIB，运行时 dyld 按该路径查找
      # 但 /tmp/AGL.framework 已被 mv 走，报 "Library not loaded"。
      # 参见 https://bugreports.qt.io/browse/QTBUG-137687
      - name: 创建 AGL stub framework (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          sudo mkdir -p /Library/Frameworks/AGL.framework/Versions/A
          echo 'void __agl_stub(void) {}' | sudo clang -dynamiclib \
            -install_name /Library/Frameworks/AGL.framework/Versions/A/AGL \
            -o /Library/Frameworks/AGL.framework/Versions/A/AGL -x c -
          sudo ln -sf Versions/A/AGL /Library/Frameworks/AGL.framework/AGL
          sudo ln -sf Versions/A /Library/Frameworks/AGL.framework/Versions/Current

      - name: 配置 CMake (macOS Preset)
        if: runner.os == 'macOS'
        run: cmake --preset macos-clang-release -DMINILANG_USE_CCACHE=ON

      # ---- 构建 ----
      # 各平台使用对应 Preset 的 binaryDir（out/build/<platform>-<config>）
      - name: 构建项目 (Windows)
        if: runner.os == 'Windows'
        run: cmake --build out/build/release --parallel

      - name: 构建项目 (Linux)
        if: runner.os == 'Linux'
        run: cmake --build out/build/linux-release --parallel

      - name: 构建项目 (macOS)
        if: runner.os == 'macOS'
        run: cmake --build out/build/macos-release --parallel

      # ---- 测试 ----
      # 修复问题 9：ctest -j 4 并行运行
      - name: 运行单元测试（并行, Windows）
        if: runner.os == 'Windows'
        working-directory: out/build/release
        run: ctest -C ${{ env.CMAKE_BUILD_TYPE }} -j 4 --output-on-failure --verbose

      - name: 运行单元测试（并行, Linux）
        if: runner.os == 'Linux'
        working-directory: out/build/linux-release
        env:
          # Headless Linux runner 无 X11 显示服务器，Qt GUI 测试需要 offscreen 平台插件。
          QT_QPA_PLATFORM: offscreen
        run: ctest -j 4 --output-on-failure --verbose

      - name: 运行单元测试（并行, macOS）
        if: runner.os == 'macOS'
        working-directory: out/build/macos-release
        run: ctest -j 4 --output-on-failure --verbose

      - name: 上传测试结果（失败时）
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-${{ matrix.os }}
          path: |
            out/build/release/Testing/**/*.xml
            out/build/linux-release/Testing/**/*.xml
            out/build/macos-release/Testing/**/*.xml
          if-no-files-found: ignore
          retention-days: 7

      # ---- 打包安装包（P2 建议 5：每次 Release 提交自动产出安装包）----
      # 仅在构建与测试均成功后执行；各平台使用对应 Preset 的 binaryDir。
      # 注：每个打包步骤必须限制 runner.os，否则会在错误平台上运行导致失败。
      - name: 安装并打包 (Windows)
        if: success() && runner.os == 'Windows'
        run: |
          cmake --install out/build/release --prefix install
          cd out/build/release && cpack -G ZIP

      - name: 安装并打包 (Linux)
        if: success() && runner.os == 'Linux'
        run: |
          cmake --install out/build/linux-release --prefix install
          cd out/build/linux-release && cpack -G TGZ

      - name: 安装并打包 (macOS)
        if: success() && runner.os == 'macOS'
        run: |
          cmake --install out/build/macos-release --prefix install
          cd out/build/macos-release && cpack -G ZIP
        # 注：使用 ZIP 而非 DragNDrop。DragNDrop 生成器在 macOS 26 (Tahoe) runner 上
        # 创建 /Applications 符号链接时报 "No such file or directory"（CPack 的
        # ALL_IN_ONE 目录未正确创建）。ZIP 更简单可靠，.dmg 可在本地 release 时生成。

      - name: 上传安装包
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: minilang-ide-${{ matrix.os }}
          path: |
            out/build/release/MiniLangIDE*.zip
            out/build/linux-release/MiniLangIDE*.tar.gz
            out/build/macos-release/MiniLangIDE*.zip
          if-no-files-found: ignore
          retention-days: 7

  # ============================================================
  # 作业 1b：Docker 构建验证（确保容器环境可靠）
  # ============================================================
  docker-build:
    name: Docker Build (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: 构建 Docker 镜像（builder 阶段）
        run: docker build --build-arg QT_VERSION=${{ env.QT_VERSION }} --target builder -t minilang-builder .

      - name: 验证构建产物
        run: |
          docker run --rm minilang-builder ls -la /app/out/build/linux-release/minilang_ide

      - name: 构建 Docker 镜像（dev 阶段）
        run: docker build --build-arg QT_VERSION=${{ env.QT_VERSION }} --target dev -t minilang-dev .

      - name: Docker Compose 构建验证
        run: QT_VERSION=${{ env.QT_VERSION }} docker compose build build

  # ============================================================
  # 作业 2：代码覆盖率 — Windows（Debug + OpenCppCoverage）
  # 修复问题 7：代码覆盖率报告
  # ============================================================
  coverage:
    name: Code Coverage - Windows (Debug)
    runs-on: windows-latest
    needs: build-test
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # 应用 QFluentKit 本地补丁（详见 build-test 作业同名步骤说明）
      - name: 应用 QFluentKit 本地补丁
        shell: bash
        run: git apply --directory=third_party/QFluentKit --whitespace=nowarn patches/qfluentkit-local-fixes.patch

      - name: 安装 Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          aqtversion: ${{ env.AQT_VERSION }}
          cache: true

      - name: 设置 MSVC 开发环境
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - name: 设置 QTDIR 环境变量
        shell: bash
        run: echo "QTDIR=${{ env.QT_ROOT_DIR }}/.." >> $GITHUB_ENV

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ${{ runner.os }}-Debug

      - name: 安装 OpenCppCoverage
        shell: powershell
        run: |
          choco install opencppcoverage -y --no-progress
          # choco 修改的是 Machine PATH，当前 PowerShell 会话未刷新，
          # 后续步骤会报 "OpenCppCoverage.exe is not recognized"。
          # 通过 GITHUB_PATH 把安装目录写入后续步骤的环境（官方推荐机制）。
          $exe = Get-ChildItem -Path 'C:\Program Files\OpenCppCoverage','C:\Program Files (x86)\OpenCppCoverage' `
                  -Filter OpenCppCoverage.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($exe) {
            $bin = Split-Path $exe.FullName
            Add-Content -Path $env:GITHUB_PATH -Value $bin
            Write-Host "OpenCppCoverage found at: $bin"
          } else {
            Write-Error "OpenCppCoverage.exe not found after choco install"
            exit 1
          }

      - name: 配置 CMake（Debug）
        # MINILANG_BUILD_PERF_TESTS=OFF：覆盖率 job 仅构建 --target minilang_tests，
        # 关闭 perf_test 目标避免无谓的配置/链接开销（与 coverage-linux 一致）。
        run: cmake --preset windows-msvc-debug -DMINILANG_BUILD_PERF_TESTS=OFF

      - name: 构建测试
        run: cmake --build out/build/debug --target minilang_tests --parallel

      - name: 运行覆盖率分析
        working-directory: out/build/debug
        run: |
          OpenCppCoverage.exe `
            --export_type cobertura:coverage.xml `
            --export_type html:coverage_html `
            --sources "${env:GITHUB_WORKSPACE}\lexer;${env:GITHUB_WORKSPACE}\parser;${env:GITHUB_WORKSPACE}\ast;${env:GITHUB_WORKSPACE}\interpreter;${env:GITHUB_WORKSPACE}\compiler;${env:GITHUB_WORKSPACE}\debug;${env:GITHUB_WORKSPACE}\formatter" `
            -- tests\minilang_tests.exe --gtest_brief=1

      # R116 覆盖率门槛：解析 cobertura XML，行覆盖率低于 75% 则失败
      # W3-3 (2026-07-24)：阈值从 60% 提升到 65%，配合 W1 /W4 警告清零后的代码质量基线。
      # P3-19 (2026-07-25)：阈值从 65% 提升到 70%，新增 TestCoverageGaps2.cpp（10 个测试）
      # 覆盖循环导入深层嵌套/并发原语边界/IR 优化 pass 验证。
      # P3-A2 (2026-07-25)：阈值从 70% 提升到 75%（覆盖率提升路径最终目标）。
      # 配合 C1 GUI E2E 测试扩展（TestTeachingPanelsE2E 新增交互样本）+ C2 GCC/Clang
      # 警告清零（Linux/macOS debug preset 启用 -Werror）进一步提升代码质量基线。
      - name: 检查覆盖率阈值（行 ≥ 75%）
        working-directory: out/build/debug
        run: |
          python "${{ github.workspace }}\scripts\coverage_threshold.py" `
            --report coverage.xml `
            --line-threshold 75.0

      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: code-coverage-windows
          path: |
            out/build/debug/coverage.xml
            out/build/debug/coverage_html/
          retention-days: 14

      - name: 上传覆盖率到 Codecov（趋势追踪）
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: out/build/debug/coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ============================================================
  # 作业 2b：代码覆盖率 — Linux（Debug + gcovr + codecov）
  # Phase 3 Task 2.3: gcov/gcovr 覆盖率上传 codecov
  # ============================================================
  coverage-linux:
    name: Code Coverage - Linux (gcovr)
    runs-on: ubuntu-latest
    needs: build-test
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # 应用 QFluentKit 本地补丁（详见 build-test 作业同名步骤说明）
      - name: 应用 QFluentKit 本地补丁
        shell: bash
        run: git apply --directory=third_party/QFluentKit --whitespace=nowarn patches/qfluentkit-local-fixes.patch

      - name: 安装 Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          aqtversion: ${{ env.AQT_VERSION }}
          cache: true

      - name: 设置 QTDIR 环境变量
        shell: bash
        run: echo "QTDIR=${{ env.QT_ROOT_DIR }}/.." >> $GITHUB_ENV

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ${{ runner.os }}-Debug-coverage

      - name: 安装 gcovr
        run: pip install gcovr

      - name: 配置 CMake（Coverage Preset）
        # MINILANG_BUILD_PERF_TESTS=OFF：覆盖率 job 仅构建 --target minilang_tests，
        # 不构建 minilang_perf_test。若不关闭，gtest_discover_tests(DISCOVERY_MODE
        # PRE_TEST) 会在 CTest 运行时注册占位测试 minilang_perf_test_NOT_BUILT
        # 并报 "Could not find executable"，导致 CTest 返回 exit code 8，
        # 阻塞后续覆盖率报告生成步骤。
        run: cmake --preset linux-gcc-coverage -DMINILANG_USE_CCACHE=ON -DMINILANG_BUILD_PERF_TESTS=OFF

      - name: 构建测试
        run: cmake --build out/build/linux-coverage --target minilang_tests --parallel

      - name: 运行测试
        working-directory: out/build/linux-coverage
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest -j 4 --output-on-failure --verbose

      - name: 生成覆盖率报告 (gcovr)
        # R116 覆盖率门槛：gcovr 原生支持 --fail-under-line，低于阈值则退出码 1
        # W3-3 (2026-07-24)：阈值从 60% 提升到 65%，与 Windows OpenCppCoverage job 保持一致。
        # P3-19 (2026-07-25)：阈值从 65% 提升到 70%，新增 TestCoverageGaps2.cpp（10 个测试）。
        # P3-A2 (2026-07-25)：阈值从 70% 提升到 75%（覆盖率提升路径最终目标）。
        run: |
          gcovr \
            --root . \
            --filter lexer/ \
            --filter parser/ \
            --filter ast/ \
            --filter interpreter/ \
            --filter compiler/ \
            --filter debug/ \
            --filter formatter/ \
            --exclude-unreachable-branches \
            --fail-under-line 75.0 \
            --cobertura coverage.xml \
            --txt \
            --html coverage.html

      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: code-coverage-linux
          path: |
            coverage.xml
            coverage.html
          retention-days: 14

      - name: 上传覆盖率到 Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ============================================================
  # 作业 3：test_harness 审计工具（确保不随代码演进而坏掉）
  # ============================================================
  test-harness:
    name: Test Harness (Windows MSVC)
    runs-on: windows-latest
    needs: build-test

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # 应用 QFluentKit 本地补丁（详见 build-test 作业同名步骤说明）
      - name: 应用 QFluentKit 本地补丁
        shell: bash
        run: git apply --directory=third_party/QFluentKit --whitespace=nowarn patches/qfluentkit-local-fixes.patch

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ${{ runner.os }}-harness

      - name: 安装 Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          aqtversion: ${{ env.AQT_VERSION }}
          cache: true

      - name: 设置 MSVC 开发环境
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - name: 设置 QTDIR 环境变量
        shell: bash
        run: echo "QTDIR=${{ env.QT_ROOT_DIR }}/.." >> $GITHUB_ENV

      - name: 配置 CMake（含 test_harness）
        run: cmake --preset windows-msvc-debug -DMINILANG_BUILD_TEST_HARNESS=ON -DMINILANG_USE_CCACHE=ON

      - name: 构建 test_harness 工具
        run: cmake --build out/build/debug --target formatter_audit stress_test diff_test ast_test --parallel

  # ============================================================
  # 作业 4：静态代码分析（cppcheck）
  # ============================================================
  static-analysis:
    name: Static Analysis (cppcheck)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v7

      - name: 安装 cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      # 注：cppcheck 在 Ubuntu 上运行，缺少 Qt 系统头文件，
      #     因此保留 --suppress=missingInclude 以免 Qt 缺失头文件噪音淹没真实问题；
      #     已显式补充 QFluentKit 的 include 路径，使其头文件可被正确解析（修复审计问题 8）。
      #     此为 best-effort 检查。
      - name: 运行 cppcheck 静态分析
        run: |
          cppcheck \
            --enable=warning,style,performance,portability \
            --suppress=missingIncludeSystem \
            --suppress=missingInclude \
            --suppress=unmatchedSuppression \
            --suppress=noExplicitConstructor \
            --inline-suppr \
            --xml \
            --xml-version=2 \
            -I lexer -I parser -I ast -I interpreter -I compiler -I debug -I formatter -I gui -I common \
            -I third_party/QFluentKit/QFluent/src -I third_party/QFluentKit/QFluent/src/QFluent \
            -DQT_CORE_LIB -DQT_GUI_LIB -DQT_WIDGETS_LIB \
            --output-file=cppcheck-report.xml \
            lexer parser ast interpreter compiler debug formatter gui common 2>&1 | tee cppcheck-stdout.txt || true

      - name: 显示分析摘要
        run: |
          echo "=== cppcheck 分析摘要 ==="
          cppcheck --version
          grep -c "<error " cppcheck-report.xml || echo "无错误"
          head -n 100 cppcheck-stdout.txt || true

      - name: 上传 cppcheck 报告
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cppcheck-report
          path: |
            cppcheck-report.xml
            cppcheck-stdout.txt
          retention-days: 14

  # ============================================================
  # 作业 5：代码风格检查（clang-format）
  # P2 建议 3：轻量 lint 步骤（无需 Qt 依赖，秒级完成）。
  # continue-on-error 使其作为信息性检查，不阻塞主构建流程。
  # ============================================================
  lint:
    name: Code Style (clang-format)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v7

      - name: 安装 clang-format
        # 通过 pip 安装固定版本，确保 CI 与本地开发环境格式化输出一致。
        # apt.llvm.org 的 snapshot 版本会随时间漂移，导致格式违规假阳性。
        run: |
          pip install clang-format==22.1.5
          clang-format --version

      - name: clang-format 风格检查
        run: |
          find lexer parser ast interpreter compiler debug formatter gui common app \
            -type f \( -name '*.cpp' -o -name '*.h' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror

  # ============================================================
  # ============================================================
  # 作业 5c：Conventional Commits 格式验证（P4-9a）
  # ------------------------------------------------------------
  # 仅 PR 触发：验证 PR 中所有 commit message 符合
  # Conventional Commits 格式（feat/fix/refactor/perf/docs/test/chore: ...）。
  # 纯 Python 标准库脚本，无需安装依赖。
  # ============================================================
  lint-commits:
    name: Commit Message Lint
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 验证 commit message 格式
        run: |
          python scripts/check_commit_msg.py \
            --range origin/${{ github.base_ref }}..HEAD

  # ============================================================
  # 作业 5b：翻译完整性检查（P2-13）
  # ------------------------------------------------------------
  # 验证 en_US.ts 与 zh_CN.ts 的消息数量一致、source 匹配、
  # translation 非空。防止新增 mlTr() 调用后忘记同步 .ts 文件。
  # 纯 Python 标准库脚本，无需安装依赖。
  # ============================================================
  translation-check:
    name: Translation Completeness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v7

      - name: 检查翻译完整性
        run: |
          python scripts/translation_check.py \
            --zh app/translations/minilang_zh_CN.ts \
            --en app/translations/minilang_en_US.ts

      # 拓展二期·平台：源码→ts 同步性检查（translation_check.py 只查
      # 两个 .ts 之间的一致性，无法发现「源码新增 mlTr 字符串但忘跑
      # lupdate」的缺口）。ratchet 基线 806 条存量欠账，新增未同步即红。
      - name: 检查源码字符串同步性（ratchet）
        run: python scripts/check_i18n.py --repo-root .

  # ============================================================
  # 作业 6：clang-tidy 静态分析（R116）
  # ------------------------------------------------------------
  # 使用项目根 .clang-tidy 配置（启用 bugprone/modernize/performance/
  # readability/misc 检查组）。需要 compile_commands.json 才能解析
  # Qt / QFluentKit 头文件路径，因此先 CMake 配置生成数据库。
  # P2-3: bugprone-*/performance-* 设为 WarningsAsErrors（阻塞），
  # readability-*/modernize-*/misc-* 仍为信息性（不阻塞）。
  # ============================================================
  clang-tidy:
    name: Static Analysis (clang-tidy)
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: 应用 QFluentKit 本地补丁
        shell: bash
        run: git apply --directory=third_party/QFluentKit --whitespace=nowarn patches/qfluentkit-local-fixes.patch

      - name: 安装 Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          aqtversion: ${{ env.AQT_VERSION }}
          cache: true

      - name: 设置 QTDIR 环境变量
        shell: bash
        run: echo "QTDIR=${{ env.QT_ROOT_DIR }}/.." >> $GITHUB_ENV

      - name: 安装 clang-tidy
        # 使用 LLVM 18 的 clang-tidy（Ubuntu 24.04 LTS 默认仓库）
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy-18
          sudo update-alternatives --install /usr/bin/clang-tidy clang-tidy /usr/bin/clang-tidy-18 100
          clang-tidy --version

      - name: 配置 CMake（生成 compile_commands.json）
        # CMAKE_EXPORT_COMPILE_COMMANDS=ON 让 CMake 生成编译数据库，
        # clang-tidy 通过 -p 指向该数据库解析每个 TU 的编译参数。
        run: cmake --preset linux-gcc-release -DMINILANG_USE_CCACHE=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: 运行 clang-tidy（核心模块）
        # run-clang-tidy 是 LLVM 自带的并行驱动脚本，自动从
        # compile_commands.json 读取所有 TU 并行执行 clang-tidy。
        # 限制为 lexer/parser/ast/interpreter/compiler/debug/formatter/common
        # 等核心模块（gui/app/tests 依赖较多 Qt 头文件，告警噪音大）。
        # 注：compile_commands.json 中路径为绝对路径（如 /home/runner/.../lexer/Lexer.cpp），
        # 所以 regex 使用子串匹配而非 ^锚定。
        # 输出重定向到 clang-tidy-report.txt 供 artifact 上传。
        run: |
          # 优先 run-clang-tidy-18，回退到 run-clang-tidy
          if command -v run-clang-tidy-18 >/dev/null; then
            RUN_CT=run-clang-tidy-18
          else
            RUN_CT=run-clang-tidy
          fi
          echo "Using: $RUN_CT"
          "$RUN_CT" -p out/build/linux-release \
            -j 4 \
            '(lexer|parser|ast|interpreter|compiler|debug|formatter|common)/' \
            2>&1 | tee clang-tidy-report.txt || true

      - name: 显示分析摘要
        run: |
          echo "=== clang-tidy 分析摘要 ==="
          clang-tidy --version
          echo ""
          echo "警告总数: $(grep -c 'warning:' clang-tidy-report.txt || echo 0)"
          echo "错误总数: $(grep -c 'error:' clang-tidy-report.txt || echo 0)"
          echo ""
          echo "Top 10 警告类别:"
          grep -oE '\[[a-z-]+\]' clang-tidy-report.txt | sort | uniq -c | sort -rn | head -10 || true

      - name: 上传 clang-tidy 报告
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: clang-tidy-report
          path: clang-tidy-report.txt
          retention-days: 14

  # ============================================================
  # 作业 6.5：ASan/UBSan 内存错误门禁（拓展计划·基建）
  # ------------------------------------------------------------
  # 手写 VM + JIT + GC + NaN-boxing 项目的最高性价比质量门禁：
  # Linux GCC Debug + -fsanitize=address,undefined 跑全量 ctest。
  # 取代原末尾信息性 sanitizers 矩阵作业（仅跑 Lexer/Parser/
  # Interpreter 子集）：ASan 升级为全量+阻断式，TSan 迁至
  # nightly.yml sanitize-tsan（并发子集，5-15x 减速不适合 PR 门禁）。
  # 设计决策：
  #   - detect_leaks=0：Qt/fontconfig 一次性分配会产生大量 LSan 噪声，
  #     首期专注 UAF/越界/UB（项目历史高频 bug 模式 1/3/6），
  #     泄漏检测待建立抑制清单后再开启
  #   - halt_on_error=1：UBSan 默认仅打印不失败，强制首错即停
  #   - allocator_may_return_null=1：RuntimeLimits 压力测试故意触发
  #     巨大分配，允许分配器返回 null 走正常 bad_alloc 路径
  #   - ASan 下 JIT 可执行页 mmap 与拦截器兼容，TestJIT 正常运行
  # ============================================================
  sanitize-asan:
    name: Sanitizer (ASan+UBSan, Linux)
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: 应用 QFluentKit 本地补丁
        shell: bash
        run: git apply --directory=third_party/QFluentKit --whitespace=nowarn patches/qfluentkit-local-fixes.patch

      - name: 安装 Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          aqtversion: ${{ env.AQT_VERSION }}
          cache: true

      - name: 设置 QTDIR 环境变量
        shell: bash
        run: echo "QTDIR=${{ env.QT_ROOT_DIR }}/.." >> $GITHUB_ENV

      - name: 安装 Qt Linguist 工具 (lrelease)
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y qt6-l10n-tools qt6-tools-dev
          which lrelease6 && sudo ln -sf "$(which lrelease6)" /usr/local/bin/lrelease || true
          which lrelease6 || which lrelease || which lrelease-qt6

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ${{ runner.os }}-asan

      - name: 配置 CMake (ASan+UBSan Preset)
        # WERROR=OFF：sanitizer 插桩可能引入 maybe-uninitialized 等新告警
        # （沿用原 sanitizers 作业经验），告警门禁由 build-test 作业把关
        run: cmake --preset linux-gcc-asan -DMINILANG_USE_CCACHE=ON -DMINILANG_WERROR=OFF

      - name: 构建项目
        run: cmake --build out/build/linux-asan --parallel

      - name: 运行单元测试（ASan+UBSan）
        working-directory: out/build/linux-asan
        env:
          QT_QPA_PLATFORM: offscreen
          ASAN_OPTIONS: detect_leaks=0:allocator_may_return_null=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        # ASan 约 2x 减速，降低并行度避免内存峰值打爆 runner
        run: ctest -j 2 --output-on-failure

  # ============================================================
  # 作业 7：性能基准回归检测（R116）
  # ------------------------------------------------------------
  # 运行 minilang_perf_test 采集三后端（Interpreter/StackVM/
  # RegisterVM）× 三基准（fib(24)/大循环/字符串拼接）的当前耗时，
  # 与 perf-baseline.json 对比，回归超 2.0x 则失败。
  #
  # 首次启用时基线 elapsed_ms=null（跳过判定），需要管理员在
  # 首次成功 CI 后用 `python scripts/perf_baseline.py update`
  # 刷新基线。本 job 仅在 Linux runner 上运行（性能数据跨平台
  # 差异大，Linux 数字最稳定）。
  # ============================================================
  perf-benchmark:
    name: Performance Benchmark (vs baseline)
    runs-on: ubuntu-latest
    needs: build-test
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: 应用 QFluentKit 本地补丁
        shell: bash
        run: git apply --directory=third_party/QFluentKit --whitespace=nowarn patches/qfluentkit-local-fixes.patch

      - name: 安装 Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          aqtversion: ${{ env.AQT_VERSION }}
          cache: true

      - name: 设置 QTDIR 环境变量
        shell: bash
        run: echo "QTDIR=${{ env.QT_ROOT_DIR }}/.." >> $GITHUB_ENV

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ${{ runner.os }}-perf-bench

      - name: 配置 CMake（Release）
        # Release 构建保证性能数据反映真实生产环境表现
        # MINILANG_BUILD_PERF_TESTS=ON 显式启用 minilang_perf_test 目标
        run: cmake --preset linux-gcc-release -DMINILANG_USE_CCACHE=ON -DMINILANG_BUILD_PERF_TESTS=ON

      - name: 构建 minilang_perf_test
        run: cmake --build out/build/linux-release --target minilang_perf_test --parallel

      - name: 运行性能基准对比基线
        run: |
          python scripts/perf_baseline.py check \
            --baseline perf-baseline.json \
            --binary out/build/linux-release/tests/minilang_perf_test

      - name: 上传性能基准报告（趋势追踪）
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: perf-benchmark-report
          path: |
            perf-baseline.json
          retention-days: 30

  # ============================================================
  # 作业 8：Doxygen 文档构建与 GitHub Pages 部署（R116）
  # ------------------------------------------------------------
  # 仅在 push 到 main/master 时部署，PR 仅构建验证不部署。
  # 部署目标：gh-pages 分支根目录，URL 形如
  #   https://<owner>.github.io/<repo>/
  #
  # 首次部署需在仓库 Settings → Pages 中将 Source 设为
  # "Deploy from a branch" → "gh-pages" → "/ (root)"。
  # ============================================================
  docs:
    name: Doxygen Documentation
    runs-on: ubuntu-latest
    needs: build-test
    if: ${{ github.event_name == 'push' }}

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v7

      - name: 安装 Doxygen 与 Graphviz
        # graphviz 提供 dot 命令用于生成类图/调用图
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz
          doxygen --version
          dot -V

      - name: 构建 Doxygen 文档
        # Doxyfile 已配置 OUTPUT_DIRECTORY=docs/api、INPUT=核心模块目录
        # GENERATE_HTML=YES、EXTRACT_ALL=YES、RECURSIVE=YES
        run: doxygen Doxyfile

      - name: 上传文档 artifact（便于审查）
        uses: actions/upload-artifact@v6
        with:
          name: doxygen-docs
          path: docs/api/html/
          retention-days: 14

      - name: 部署到 GitHub Pages
        # 仅 main 分支 push 触发部署；PR 仅构建验证不部署
        if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/api/html
          publish_branch: gh-pages
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy Doxygen docs (${{ github.sha }})'

  # ============================================================
  # 作业 9：PGO 两趟构建（仅 push to main，不阻塞 PR）
  # ------------------------------------------------------------
  # Profile-Guided Optimization 两趟构建：
  #   Pass 1: PGO_GENERATE 构建 + 运行测试生成 profile 数据
  #   Pass 2: PGO_USE 构建 + 运行性能基准验证收益
  # 仅 Windows MSVC（主 CI 平台），作为信息性 job（continue-on-error）。
  # ============================================================
  pgo-build:
    name: PGO Two-Pass Build (Windows)
    runs-on: windows-latest
    needs: build-test
    if: ${{ github.event_name == 'push' }}
    continue-on-error: true

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: 安装 Qt6 (Windows)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          aqtversion: ${{ env.AQT_VERSION }}
          cache: true

      - name: 设置 MSVC 开发环境
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - name: 设置 QTDIR
        shell: bash
        run: echo "QTDIR=${{ env.QT_ROOT_DIR }}/.." >> $GITHUB_ENV

      # Pass 1: PGO 插桩构建 + 运行测试生成 profile
      - name: "PGO Pass 1: 配置 (Generate)"
        run: >
          cmake --preset windows-msvc-release
          -DMINILANG_PGO_GENERATE=ON
          -DMINILANG_USE_CCACHE=OFF

      - name: "PGO Pass 1: 构建"
        run: cmake --build out/build/release --parallel

      - name: "PGO Pass 1: 运行测试 (生成 profile)"
        working-directory: out/build/release
        run: ctest -C Release -j 4 --output-on-failure

      # Pass 2: PGO 优化构建 + 性能验证
      - name: "PGO Pass 2: 重新配置 (Use)"
        run: >
          cmake --preset windows-msvc-release
          -DMINILANG_PGO_USE=ON
          -DMINILANG_PGO_GENERATE=OFF
          -DMINILANG_USE_CCACHE=OFF

      - name: "PGO Pass 2: 构建"
        run: cmake --build out/build/release --parallel

